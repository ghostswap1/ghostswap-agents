name: Feature request
description: Suggest an improvement to the pack — a new tool, runtime, helper, or doc surface.
labels: ['enhancement', 'triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Start with the user need, not the proposed solution.
      placeholder: 'When I use this pack with <runtime>, I have to manually <step> because there is no <thing>.'
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you add, change, or remove?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why this one wins.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      description: This pack distributes the existing GhostSwap Partners API. New REST endpoints originate from the API itself, not here.
      options:
        - label: This is about the agent-pack surfaces (MCP / OpenAPI / SKILL / AGENTS) — not a new API endpoint.
          required: true
